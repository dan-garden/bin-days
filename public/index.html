<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The server replaces this block with each page's own title, description and structured data (src/api/site.ts). -->
    <!--seo:head-->
    <title>Bin Days: which bins go out this week?</title>
    <meta
      name="description"
      content="Type your address to see your next bin collection day and which bins go out, for councils across Australia."
    />
    <!--/seo:head-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Fetched alongside the stylesheet, so the heading is drawn once in its real font. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/assets/outfit-latin-wght-normal-Bc-8i84L.woff2"
    />
    <meta name="theme-color" content="#f5f7f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1412" media="(prefers-color-scheme: dark)" />
    <script>
      // Set the colour scheme before first paint so dark mode doesn't flash white: the
      // choice made with the theme button if there is one, else the system setting.
      (() => {
        let chosen;
        try {
          chosen = localStorage.getItem('mantine-color-scheme-value');
        } catch {}
        const dark =
          chosen === 'dark' ||
          (chosen !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.mantineColorScheme = dark ? 'dark' : 'light';
        // Marks that the app is about to take over, so the no-JavaScript content stays hidden.
        document.documentElement.classList.add('js');
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-ZE59Ssym.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-cW1CSHqc.css">
  </head>
  <body>
    <div id="root"><!--seo:body--></div>
  </body>
</html>
